<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d111b"><meta name="description" content="Build itemized invoices and print or save them as PDF."><title>TinyInvoice</title><style>body{margin:0;background:#0d111b;color:#eef2ff;font:15px system-ui}main{max-width:1000px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;color:#89b4fa;font-weight:800}.hero{margin:28px 0}.hero h1{font-size:42px;margin:8px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#151c2a;border:1px solid #293449;border-radius:16px;padding:18px}.stack{display:grid;gap:10px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}label{display:grid;gap:5px;color:#9aa8bf;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;background:#0d1421;color:#eef2ff;border:1px solid #293449;border-radius:9px;padding:10px;font:inherit}button{background:#89b4fa;color:#101522;border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.secondary{background:#29364c;color:#eef2ff}.danger{background:#482637;color:#ffdce5}.item{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #293449;border-radius:10px;margin-top:8px;background:#101725}.muted,small{color:#9aa8bf}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:24px;border:1px dashed #293449;border-radius:10px;text-align:center;color:#9aa8bf}.stats{display:flex;gap:8px}.stats div{flex:1;background:#101725;padding:10px;border-radius:10px;min-width:0}.stats b{display:block;font-size:20px;overflow-wrap:anywhere}footer{text-align:center;color:#9aa8bf;margin:25px;font-size:12px}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero h1{font-size:34px}}@media print{body{background:white;color:black}.panel{background:white;color:black}button,header,footer{display:none}}</style></head><body><main><header><span>TinyInvoice</span><small>LOCAL · PRIVATE · FREE</small></header><section class="hero"><small>ERROR404DTIR / OPEN SOURCE</small><h1>TinyInvoice</h1><p class="muted">Build itemized invoices and print or save them as PDF.</p></section><div class="layout"><section class="panel stack"><h3>Invoice details</h3><div class="row"><label>Business<input id="seller"></label><label>Invoice #<input id="num" value="INV-001"></label></div><label>Customer<input id="client"></label><div class="row"><label>Date<input id="date" type="date"></label><label>Currency<select id="currency"><option>USD</option><option>EUR</option><option>GBP</option></select></label></div><h3>Items</h3><div id="lines"></div><button id="add" class="secondary">Add item</button><div class="row"><label>Tax %<input id="tax" type="number" value="0"></label><label>Discount<input id="discount" type="number" value="0"></label></div><label>Notes<textarea id="notes"></textarea></label><div class="actions"><button id="print">Print / Save PDF</button><button id="save" class="secondary">Save draft</button><button id="load" class="secondary">Load draft</button></div></section><section class="panel" id="paper"><h3>Preview</h3><div id="preview"></div></section></div><footer>Made to be useful · Runs in your browser · No account required</footer></main><script>const $=x=>document.getElementById(x);let lines=[{name:'Service',qty:1,price:100}];$('date').value=new Date().toISOString().slice(0,10);function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function money(n){return new Intl.NumberFormat(undefined,{style:'currency',currency:$('currency').value}).format(n)}function draw(){$('lines').innerHTML=lines.map((x,i)=>'<div class="item"><div><input data-i="'+i+'" data-k="name" value="'+esc(x.name)+'"><div class="row"><input data-i="'+i+'" data-k="qty" type="number" min="1" value="'+x.qty+'"><input data-i="'+i+'" data-k="price" type="number" min="0" value="'+x.price+'"></div></div><button class="danger" data-del="'+i+'">×</button></div>').join('');let sub=lines.reduce((s,x)=>s+x.qty*x.price,0),disc=Math.min(sub,+$('discount').value||0),tax=(sub-disc)*(+$('tax').value||0)/100;$('preview').innerHTML='<h1>INVOICE</h1><p>'+esc($('seller').value)+'<br>To: '+esc($('client').value)+'<br>#'+esc($('num').value)+' · '+$('date').value+'</p><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>'+lines.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td></tr>').join('')+'</table><p>Subtotal: '+money(sub)+'<br>Discount: '+money(disc)+'<br>Tax: '+money(tax)+'<br><b>Total: '+money(sub-disc+tax)+'</b></p>'+esc($('notes').value)}$('lines').oninput=e=>{let i=e.target.dataset.i;if(i===undefined)return;let k=e.target.dataset.k;lines[+i][k]=k==='name'?e.target.value:+e.target.value;draw()};$('lines').onclick=e=>{if(e.target.dataset.del!==undefined){lines.splice(+e.target.dataset.del,1);draw()}};$('add').onclick=()=>{lines.push({name:'New item',qty:1,price:0});draw()};document.querySelectorAll('input:not([data-i]),select,textarea').forEach(x=>x.addEventListener('input',draw));$('print').onclick=()=>window.print();$('save').onclick=()=>localStorage.setItem('tinyinvoice',JSON.stringify({lines,fields:Object.fromEntries(['seller','num','client','date','currency','tax','discount','notes'].map(k=>[k,$(k).value]))}));$('load').onclick=()=>{let d=JSON.parse(localStorage.getItem('tinyinvoice')||'null');if(!d)return alert('No saved draft');lines=d.lines;Object.entries(d.fields).forEach(([k,v])=>$(k).value=v);draw()};draw();</script></body></html>
